[package]
name = "rust-map-mobile"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "CanvasRenderingContext2d",
  "Path2d",
  "HtmlCanvasElement",
  "Window",
  "Document",
  "Element",
  "console",
  "Performance"
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

