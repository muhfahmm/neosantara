<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72" fill="none">
  <defs>
    <!-- Background / base glow -->
    <filter id="shop-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="shop-awning-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFAA" />
      <stop offset="100%" stop-color="#0E7490" />
    </linearGradient>
    <linearGradient id="shop-awning-secondary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="shop-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <linearGradient id="shop-gem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>
    <linearGradient id="shop-base" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- Isometric / Game Shop Stand -->
  <g filter="url(#shop-glow)">
    <!-- Base Platform Shadow -->
    <ellipse cx="36" cy="62" rx="28" ry="6" fill="#000000" fill-opacity="0.4" />

    <!-- Isometric Counter / Kiosk Body -->
    <path d="M14 43 L36 53 L58 43 L58 53 L36 63 L14 53 Z" fill="url(#shop-base)" stroke="#00FFAA" stroke-width="1.5" stroke-linejoin="round" />
    <path d="M36 53 L36 63" stroke="#00FFAA" stroke-width="1.5" />

    <!-- Counter Top Surface -->
    <polygon points="14,43 36,33 58,43 36,53" fill="#134E4A" stroke="#00FFAA" stroke-width="1.2" stroke-linejoin="round" />

    <!-- Supporting Pillars -->
    <line x1="18" y1="41" x2="18" y2="25" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
    <line x1="54" y1="41" x2="54" y2="25" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />

    <!-- Canopy / Awning -->
    <!-- Awning back/ridge -->
    <polygon points="36,10 14,21 36,31 58,21" fill="url(#shop-awning-primary)" stroke="#00FFAA" stroke-width="1.5" stroke-linejoin="round" />

    <!-- Awning striped folds (Neon Cyberpunk Style) -->
    <path d="M14 21 L22 25 L22 17 L14 21 Z" fill="url(#shop-awning-secondary)" />
    <path d="M22 25 L30 29 L30 14 L22 17 Z" fill="url(#shop-awning-primary)" opacity="0.9" />
    <path d="M30 29 L36 31 L36 10 L30 14 Z" fill="url(#shop-awning-secondary)" />
    <path d="M36 31 L42 29 L42 14 L36 10 Z" fill="url(#shop-awning-primary)" opacity="0.9" />
    <path d="M42 29 L50 25 L50 17 L42 14 Z" fill="url(#shop-awning-secondary)" />
    <path d="M50 25 L58 21 L58 21 L50 17 Z" fill="url(#shop-awning-primary)" opacity="0.9" />

    <!-- Awning Scallop / Front Trim -->
    <path d="M14 21 Q18 26 22 25 Q26 30 30 29 Q33 32 36 31 Q39 32 42 29 Q46 30 50 25 Q54 26 58 21" 
          stroke="#E0F2FE" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Neon Showcase Items on Counter: Coins (NEO) & Diamond (GEMS) -->
    <!-- Gold NEO Coin Stack -->
    <ellipse cx="28" cy="42" rx="4.5" ry="2.2" fill="url(#shop-gold)" stroke="#FEF08A" stroke-width="0.8" />
    <ellipse cx="28" cy="40" rx="4.5" ry="2.2" fill="url(#shop-gold)" stroke="#FEF08A" stroke-width="0.8" />
    <ellipse cx="28" cy="38" rx="4.5" ry="2.2" fill="url(#shop-gold)" stroke="#FEF08A" stroke-width="0.8" />

    <!-- Glowing Gem / Diamond -->
    <polygon points="44,34 49,38 44,43 39,38" fill="url(#shop-gem)" stroke="#A5F3FC" stroke-width="1" stroke-linejoin="round" />
    <polygon points="44,34 49,38 44,39 39,38" fill="#E0F2FE" opacity="0.7" />

    <!-- Center Accent Badge / Shop Sign Emblem -->
    <circle cx="36" cy="18" r="4.5" fill="#0F172A" stroke="#00FFAA" stroke-width="1.2" />
    <path d="M34 16 L38 16 L38 20 L34 20 Z" fill="#00FFAA" opacity="0.8" />
    <path d="M35 15.5 C35 14.5 37 14.5 37 15.5" stroke="#00FFAA" stroke-width="1" fill="none" />
  </g>
</svg>